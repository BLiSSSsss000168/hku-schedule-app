name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "ios/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-unsigned-ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy frontend dependencies
        run: npm run copy:vendor

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned IPA
        run: bash scripts/package-unsigned-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKU-Schedule-unsigned-ipa
          path: artifacts/HKU-Schedule-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
